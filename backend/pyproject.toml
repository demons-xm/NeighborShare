[project]
name = "app"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.4",
    "aiomysql>=0.3.2",
    "bcrypt>=5.0.0",
    "cryptography>=50.0.2",
    "fastapi>=0.143.0",
    "passlib[bcrypt]>=1.7.4",
    "pillow>=12.3.0",
    "pwdlib[argon2]>=0.3.1",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "qrcode>=8.2",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
